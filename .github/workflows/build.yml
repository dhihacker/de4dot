name: GitHub CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  release:
    types: released

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup MSBuild path
        id: msbuild
        shell: pwsh
        run: |
          $msbuildExe = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest `
            -requires Microsoft.Component.MSBuild `
            -find MSBuild\Current\Bin\amd64\MSBuild.exe | Select-Object -First 1

          $msbuildPath = Split-Path $msbuildExe -Parent
          echo "MSBUILD_PATH=$msbuildPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build project
        shell: pwsh
        run: |
          $env:PATH = "${{ env.MSBUILD_PATH }};$env:PATH"
          .\build.ps1

      # ---------------------------
      # UPLOAD ARTIFACTS (v4)
      # ---------------------------

      - name: Upload net35
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          name: de4dot-net35
          path: Release/net35
          if-no-files-found: ignore

      - name: Upload net45
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          name: de4dot-net45
          path: Release/net45
          if-no-files-found: ignore

      - name: Upload netcoreapp2.1
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          name: de4dot-netcoreapp2.1
          path: publish-netcoreapp2.1
          if-no-files-found: ignore

      - name: Upload netcoreapp3.1
        uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')
        with:
          name: de4dot-netcoreapp3.1
          path: publish-netcoreapp3.1
          if-no-files-found: ignore
